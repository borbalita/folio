[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "cryptography==50.0.2",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "langfuse==4.17.0",
    "openai==3.29.0",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-ai[typesafe]==2.55.0",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "segno==1.6.6",
    "sqlalchemy==2.1.4",
    "structlog==26.1.0",
    "supabase==2.32.0",
    "typesafe-sdk==0.7.4",
    "uvicorn==0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "docling==2.138.0",
    "ipykernel==7.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require live Supabase, OpenAI, or the local eval database (evals/README.md)",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals", "ingest", "tests"]
known-third-party = ["alembic"]
