[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.5",
    "cryptography==49.0.0",
    "fastapi==0.141.0",
    "httpx==0.28.1",
    "langfuse==4.14.5",
    "openai==3.16.2",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-ai[typesafe]==2.46.0",
    "pydantic-settings==2.14.2",
    "pyjwt==2.13.0",
    "sqlalchemy==2.0.51",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "typesafe-sdk==0.7.0",
    "uvicorn==0.52.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "docling==2.119.0",
    "ipykernel==7.3.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require live Supabase or OpenAI",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "ingest", "tests"]
known-third-party = ["alembic"]
