[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "cryptography==50.0.2",
    "fastapi==0.148.0",
    "httpx==0.28.1",
    "langfuse==5.0.2",
    "openai==3.35.1",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-ai[typesafe]==2.57.0",
    "pydantic-settings==2.16.0",
    "pyjwt==2.15.1",
    "segno==1.6.6",
    "sqlalchemy==2.1.5",
    "structlog==26.1.0",
    "supabase==2.33.0",
    "typesafe-sdk==0.7.5",
    "uvicorn==0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"
# certifi 2026.10.19 fixes PYSEC-2026-4320 and was 2 days old when needed; drop this
# exception once that release is older than 7 days (2026-10-26).
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

[dependency-groups]
dev = [
    "docling==2.140.0",
    "ipykernel==7.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require live Supabase, OpenAI, or the local eval database (evals/README.md)",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals", "ingest", "tests"]
known-third-party = ["alembic"]
