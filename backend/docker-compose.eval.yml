# Local Postgres for evaluations. Never point evals at the app database.
services:
  eval-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: folio_eval
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - eval-db:/var/lib/postgresql/data

volumes:
  eval-db:
