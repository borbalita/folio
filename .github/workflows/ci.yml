name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: cp .env.example .env
      - run: uv run ruff check .
      - run: uv run pytest -m "not integration"
        env:
          # Settings refuse EMAIL_RERANK (on by default) without TYPESAFE_API_KEY. The
          # fast suite sets reranking explicitly where it tests it, so no key is needed.
          EMAIL_RERANK: "false"
      # Runtime packages only; a known vulnerability fails the build until it is upgraded.
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project > requirements-audit.txt
      - run: uvx pip-audit==2.10.1 -r requirements-audit.txt --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b --noEmit
      - run: pnpm lint
      # Only what ships in the bundle; build tools like the shadcn CLI never reach the browser.
      - run: pnpm audit --prod --audit-level high
